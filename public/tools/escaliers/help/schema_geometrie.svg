<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1e3a8a">Conventions géométriques (coupe longitudinale)</text>
  <!-- appuis -->
  <rect x="40" y="250" width="30" height="80" fill="#cbd5e1" stroke="#475569"/>
  <rect x="660" y="120" width="30" height="80" fill="#cbd5e1" stroke="#475569"/>
  <!-- dalle : palier bas, marches, palier haut -->
  <path d="M70 250 L230 250 L230 225 L270 225 L270 200 L310 200 L310 175 L350 175 L350 150 L390 150 L390 125 L660 125 L660 150 L445 150 L260 272 L70 272 Z" fill="#e0f2fe" stroke="#0f172a" stroke-width="2"/>
  <!-- cotes horizontales -->
  <g stroke="#1d4ed8" fill="#1d4ed8">
    <line x1="70" y1="310" x2="230" y2="310"/><line x1="230" y1="310" x2="430" y2="310"/><line x1="430" y1="310" x2="660" y2="310"/>
    <line x1="70" y1="303" x2="70" y2="317"/><line x1="230" y1="303" x2="230" y2="317"/><line x1="430" y1="303" x2="430" y2="317"/><line x1="660" y1="303" x2="660" y2="317"/>
  </g>
  <text x="150" y="330" text-anchor="middle" fill="#1d4ed8" font-weight="bold">a (palier bas)</text>
  <text x="330" y="330" text-anchor="middle" fill="#1d4ed8" font-weight="bold">b = N × g₀ (volée)</text>
  <text x="545" y="330" text-anchor="middle" fill="#1d4ed8" font-weight="bold">c (palier haut)</text>
  <text x="55" y="350" text-anchor="middle" fill="#475569">e₁</text><text x="675" y="218" text-anchor="middle" fill="#475569">e₂</text>
  <!-- h0 g0 -->
  <line x1="222" y1="250" x2="222" y2="225" stroke="#dc2626"/><text x="200" y="242" fill="#dc2626" font-weight="bold">h₀</text>
  <line x1="230" y1="218" x2="270" y2="218" stroke="#dc2626"/><text x="240" y="213" fill="#dc2626" font-weight="bold">g₀</text>
  <!-- H -->
  <line x1="715" y1="125" x2="715" y2="250" stroke="#16a34a"/><line x1="708" y1="125" x2="722" y2="125" stroke="#16a34a"/><line x1="708" y1="250" x2="722" y2="250" stroke="#16a34a"/>
  <text x="706" y="112" text-anchor="end" fill="#16a34a" font-weight="bold">H = N × h₀</text>
  <line x1="660" y1="250" x2="722" y2="250" stroke="#16a34a" stroke-dasharray="4 3"/>
  <!-- épaisseurs -->
  <text x="110" y="266" fill="#0f172a">h₁</text><text x="470" y="160" fill="#0f172a" transform="rotate(-33 470 160)">h₂ (paillasse, ⊥ au rampant)</text><text x="590" y="142" fill="#0f172a">h₃</text>
  <!-- alpha -->
  <path d="M300 272 A 45 45 0 0 0 296 250" fill="none" stroke="#7c3aed"/><text x="305" y="262" fill="#7c3aed">α</text>
  <!-- encadré -->
  <rect x="20" y="42" width="420" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="32" y="62" fill="#0f172a">N = nombre de contremarches (champ « Marches »)</text>
  <text x="32" y="80" fill="#0f172a">Confort : 60 cm ≤ 2h₀ + g₀ ≤ 64 cm (Blondel)</text>
  <text x="32" y="98" fill="#0f172a">L_eff = a + b + c + min(e₁, h₁)/2 + min(e₂, h₃)/2</text>
</svg>
