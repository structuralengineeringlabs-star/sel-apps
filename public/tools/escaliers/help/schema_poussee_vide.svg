<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#1e3a8a">Angle rentrant paillasse / palier haut : aciers inférieurs</text>
  <g transform="translate(20,50)">
