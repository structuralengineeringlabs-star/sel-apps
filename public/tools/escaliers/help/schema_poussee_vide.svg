    <circle cx="182" cy="119" r="16" fill="none" stroke="#dc2626" stroke-dasharray="4 3"/>
    <text x="225" y="88" fill="#0369a1">(02) prolongée de l_bd</text>
    <text x="210" y="150" fill="#0e7490">(03) ancrée de l_bd</text>
    <text x="20" y="250" fill="#334155">Ancrage de chaque barre au-delà de l'arête (EC2 §8.4).</text>
