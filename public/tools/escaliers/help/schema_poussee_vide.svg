    <line x1="182" y1="120" x2="194" y2="158" stroke="#dc2626" stroke-width="3"/><path d="M197 166 l-9 -6 l8 -4 z" fill="#dc2626"/>
    <text x="205" y="170" fill="#dc2626">poussée F = 2·As·fyd·sin(α/2)</text>
